name: Build and publish MCPB
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify consumer contract
        run: node --test test/external-a2a-contract.test.cjs
      - name: Build MCPB for published sources
        run: |
          mkdir -p .mcpb-build/server/mcp
          cp manifest.json .mcpb-build/manifest.json
          cp mcp/index.js .mcpb-build/server/mcp/index.js
          cp icon.png .mcpb-build/icon.png
          (cd .mcpb-build && zip -q -r ../veyline.mcpb manifest.json icon.png server/)
          unzip -t veyline.mcpb
          node --check mcp/index.js
          sha256sum veyline.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: veyline-mcpb
          path: veyline.mcpb
      - name: Publish tested release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; preserving immutable published asset and checksum"
          else
            gh release create "v$VERSION" veyline.mcpb --target "$GITHUB_SHA" --title "veyline v$VERSION" --notes "Verified MCPB build from the source release."
          fi
